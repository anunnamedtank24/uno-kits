; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; shared register save / restore: about 1.5 KB smaller, a few cycles more per call
    -mcall-prologues
; LDF skips src/test/ when scanning includes, so list the local libs explicitly
lib_deps =
    Uno
    ST7789
    graphics
    color
    font
    video
    DS18B20
    SSD1306
    image
    switch
    buzzer
    audio
    NEC
    LED
    ultrasonic
    TCRT5000
    L298N
    analog
    stream
    bluetooth
; pio device monitor: the same as BAUD in the settings of every program
monitor_speed = 1000000
; before every build: converts the FONT / PICTURE / ANIMATION / MELODY files the program names (src/tools/assets.py)
extra_scripts = pre:src/tools/assets.py
; the python that runs the converters (it needs their packages: Pillow, numpy, ...); your own one goes in .env
; (not in git): ASSET_PYTHON=~/.pyenv/versions/3.13.13/bin/python, which comes before this line
custom_asset_python = python3
; the board's numbers the tools on the computer use (flash size and attribute, clock, drawing cycles, tone range,
; sample clock, serial): convert.py --board, stream.py --board, src/tools/assets.py take them from this file;
; another board: its own board.json, this line, then python src/clean.py --rebuild
custom_board = lib/Uno/board.json
