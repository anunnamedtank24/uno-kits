; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; shared register save / restore: about 1.5 KB smaller, a few cycles more per call
    -mcall-prologues
; LDF skips src/test/ when scanning includes, so list the local libs explicitly
lib_deps =
    Uno
    ST7789
    graphics
    color
    font
    video
    DS18B20
    SSD1306
    image
    switch
    buzzer
    audio
    NEC
    LED
    ultrasonic
    TCRT5000
    L298N
    analog
    stream
; pio device monitor: the same as BAUD in the settings of every program
monitor_speed = 1000000
; before every build: converts the FONT / PICTURE / ANIMATION / MELODY files the program names (tools/assets.py)
extra_scripts = pre:tools/assets.py
; the python that runs the converters (it needs their packages: Pillow, numpy, ...)
custom_asset_python = ~/.pyenv/versions/3.13.13/bin/python
